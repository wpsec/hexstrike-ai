services:
  hexstrike:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KALI_MIRROR: http://mirrors.aliyun.com/kali
        SECURITY_TOOLS_PROFILE: full
        SECURITY_TOOLS_CATEGORIES: ""
        SECURITY_TOOLS_STRICT: "1"
        SECURITY_TOOLS_NO_BROWSER: "0"
    image: hexstrike-ai:kali
    pull_policy: never
    container_name: hexstrike-ai
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      HEXSTRIKE_HOST: "0.0.0.0"
      HEXSTRIKE_PORT: "8888"
      PYTHONUNBUFFERED: "1"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data
